# RTK (Rust Token Killer) configuration — see `rtk config` for the full default set.
# Synced to ~/.config/rtk/config.toml at container start via postStart.sh (init_rtk),
# hash-tracked so a user-edited copy is never overwritten.
# See: https://github.com/rtk-ai/rtk
#
# Policy: rtk compresses SURVEY output (what is here? what changed? what failed?)
# where lossy is fine, and NEVER touches FIDELITY reads (the exact bytes of a
# file about to be edited).
#
# Measured on a 632-line Go file:
# `rtk read` returned 385 lines — it strips comments. On the read path that
# feeds an edit, that is silent information loss, and it would make the
# /comment skill and developer-commentator agents "fix" comments that already
# exist. Hence the exclusions below.

[hooks]
# Fidelity reads: the agent needs the real bytes, including comments.
# Shell builtins: a rewrite of cd/export/set changes the shell's own state; echo is a trivial passthrough.
exclude_commands = ["cd", "pwd", "set", "export", "echo", "cat", "head", "tail", "sed", "awk", "diff", "sha256sum", "md5sum", "base64", "xxd", "od"]

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [".git", "node_modules", "target", "__pycache__", ".venv", "vendor", "zig-out", "zig-cache", ".zig-cache"]
ignore_files = ["*.lock", "*.min.js", "*.min.css", "*.sum"]

[tracking]
enabled = true
history_days = 90

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false
